# Deep sleep powers the radio off, so the host cannot reconnect until a key
# is pressed on each half. No RGB/OLED, so idle draw is low enough to skip it.
CONFIG_ZMK_SLEEP=n

# Allow re-pairing over an existing bond, and use the connection settings
# ZMK plans to make default. SEC implies passkey entry; keep "just works".
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Report the peripheral half's battery to the host as well.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
